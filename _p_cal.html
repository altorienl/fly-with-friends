<!doctype html><html><body style="margin:0">
<iframe id="f" src="/index.html" style="width:390px;height:2400px;border:0"></iframe>
<script>
const w=ms=>new Promise(r=>setTimeout(r,ms));
f.onload=async()=>{
  const d=f.contentDocument, W=f.contentWindow;
  await w(600);
  const dest=d.getElementById('dest'); dest.focus();
  for(const ch of 'nash'){ dest.value+=ch; dest.dispatchEvent(new W.Event('input',{bubbles:true})); await w(60); }
  await w(300);
  d.querySelectorAll('#destAc .ac-item')[1].click();
  await w(300);
  d.getElementById('to2').click();
  await w(600);
  const b=d.getElementById('dateBtn');
  b.dispatchEvent(new W.PointerEvent('pointerdown',{bubbles:true}));
  b.dispatchEvent(new W.MouseEvent('mousedown',{bubbles:true}));
  b.dispatchEvent(new W.MouseEvent('mouseup',{bubbles:true}));
  b.dispatchEvent(new W.MouseEvent('click',{bubbles:true}));
  await w(1200);
  document.title = 'expanded=' + b.getAttribute('aria-expanded') + ' calHidden=' + d.getElementById('cal').classList.contains('hidden');
};
</script></body></html>
