<!doctype html><html><body style="margin:0">
<iframe id="f" src="/index.html" style="width:390px;height:1600px;border:0"></iframe>
<script>
const w=ms=>new Promise(r=>setTimeout(r,ms));
f.onload=async()=>{
  const d=f.contentDocument, W=f.contentWindow;
  await w(500);
  const dest=d.getElementById('dest'); dest.focus();
  for(const ch of 'nash'){ dest.value+=ch; dest.dispatchEvent(new W.Event('input',{bubbles:true})); await w(40); }
  await w(250); d.querySelectorAll('#destAc .ac-item')[1].click(); await w(200);
  d.getElementById('to2').click(); await w(600);
  d.querySelector('#cal [data-cal="1"]').click(); await w(400);
  const pick=v=>[...d.querySelectorAll('#cal [data-day]')].find(b=>b.getAttribute('data-day')===v);
  pick('2026-11-13').click(); await w(300);
  pick('2026-11-16').click(); await w(300);
  d.querySelector('#cal [data-cal="done"]')?.click(); await w(300);
  d.getElementById('to3').click(); await w(900);
};
</script></body></html>
