<!DOCTYPE html><meta charset="utf-8">
<body style="margin:0">
<iframe id="f" src="index.html" style="width:1280px;height:1000px;border:0"></iframe>
<pre id="dump" style="font:11px monospace;white-space:pre-wrap"></pre>
<script>
function d(){ return document.getElementById('f').contentDocument; }
setTimeout(function(){
  d().getElementById('demo').click();
  setTimeout(function(){
    d().querySelectorAll('details').forEach(function(x){ x.open = true; });
    setTimeout(function(){
      var out=[];
      d().querySelectorAll('details').forEach(function(x){ out.push('=== DETAILS: '+x.innerText+'\n'); });
      document.getElementById('dump').textContent = out.join('\n');
    }, 800);
  }, 1200);
}, 1500);
</script>
