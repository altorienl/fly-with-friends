<!doctype html><html><body style="margin:0">
<iframe id="f" src="/index.html" style="width:390px;height:1800px;border:0"></iframe>
<script>
const w=ms=>new Promise(r=>setTimeout(r,ms));
f.onload=async()=>{
  const d=f.contentDocument, W=f.contentWindow;
  await w(600);
  const dest=d.getElementById('dest'); dest.focus();
  for(const ch of 'nash'){ dest.value+=ch; dest.dispatchEvent(new W.Event('input',{bubbles:true})); await w(60); }
  await w(350);
  d.querySelectorAll('#destAc .ac-item')[1].click();
  await w(350);
  d.getElementById('to2').click();
  await w(500);
  d.getElementById('dateBtn').click();
  await w(900);
};
</script></body></html>
