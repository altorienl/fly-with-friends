name = "fly-with-friends-api"
main = "worker.js"
compatibility_date = "2026-10-27"

# Namespace id is filled in by:
#   npx wrangler kv namespace create FWF
[[kv_namespaces]]
binding = "FWF"
id = "25716e1f76e943bca5011c69ab6f5d52"

# The SerpApi key is a secret, never a var:
#   npx wrangler secret put SERPAPI_KEY

# Required. Left unset, originOk() fails open and every POST is reachable from
# any page on the internet, which is how a per-IP guard gets bypassed at scale:
# one hostile page spends the allowance using thousands of visitors' IPs, each
# looking like a single polite caller. Does not gate GET, so shared links keep
# opening inside WhatsApp and iMessage browsers.
#
# Both hostnames, and the workers.dev one never comes out of this list: every
# ?t= trip link shared before the move to fly.altorien.com points at it, and
# dropping it would not break those links visibly -- the page would still
# load, the trip would still render, and only saving or re-searching would
# fail with a 403. That is the worst kind of breakage, so the entry stays.
[vars]
ALLOWED_ORIGINS = "https://fly.altorien.com,https://fly-with-friends.altorien.workers.dev"
