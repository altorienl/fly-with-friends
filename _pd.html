<!DOCTYPE html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" src="index.html" style="width:1280px;height:3000px;border:0"></iframe>
<script>
function d(){ return document.getElementById('f').contentDocument; }
function W(){ return document.getElementById('f').contentWindow; }
function fire(n,t,c){ n.dispatchEvent(new (W())[c](t,{bubbles:true})); }
setTimeout(function(){
  var w=W();
  w.fetch = function(){ console.log('FETCH CALLED'); return Promise.reject('blocked'); };
  d().getElementById('demo').click();
  setTimeout(function(){
    d().querySelectorAll('details').forEach(function(x){x.open=true;});
    setTimeout(function(){
      // find the land-between time inputs inside the options panel
      var ins = d().querySelectorAll('#optionsBody input[type=time]');
      if(ins.length>=2){ ins[0].value='00:00'; fire(ins[0],'change','Event'); ins[1].value='20:00'; fire(ins[1],'change','Event'); }
    }, 500);
  }, 1300);
}, 1500);
</script>
