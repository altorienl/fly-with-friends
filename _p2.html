<!DOCTYPE html><meta charset="utf-8">
<body style="margin:0">
<iframe id="f" src="index.html" style="width:1280px;height:1000px;border:0"></iframe>
<pre id="dump" style="font:11px monospace;white-space:pre-wrap"></pre>
<script>
function d(){ return document.getElementById('f').contentDocument; }
setTimeout(function(){
  d().getElementById('demo').click();
  setTimeout(function(){
    var b=d().body;
    document.getElementById('dump').textContent = b.innerText;
  }, 1200);
}, 1500);
</script>
