<!doctype html><html><body style="margin:0">
<iframe id="f" src="/index.html" style="width:390px;height:1000px;border:0"></iframe>
<pre id="log" style="font:11px monospace;white-space:pre-wrap"></pre>
<script>
const w=ms=>new Promise(r=>setTimeout(r,ms));
f.onload=async()=>{
  const d=f.contentDocument, W=f.contentWindow;
  await w(600);
  const dest=d.getElementById('dest');
  dest.focus();
  for(const ch of 'Nashville'){ dest.value+=ch; dest.dispatchEvent(new W.Event('input',{bubbles:true})); await w(80); }
  await w(500);
  log.textContent += 'HINT after full typing: '+JSON.stringify(d.getElementById('destHint').textContent)+'\n';
  log.textContent += 'HINT class: '+d.getElementById('destHint').className+'\n';
  d.getElementById('go').click();
  await w(700);
  log.textContent += 'step1 hidden? '+d.getElementById('s1').classList.contains('hidden')+'\n';
  log.textContent += 'step2 hidden? '+d.getElementById('s2').classList.contains('hidden')+'\n';
  log.textContent += 'HINT after click: '+JSON.stringify(d.getElementById('destHint').textContent)+'\n';
  log.textContent += 'S2 subtitle: '+JSON.stringify(d.getElementById('h-s2').textContent)+' / '+JSON.stringify(d.getElementById('s2sub').textContent)+'\n';
  log.textContent += 'docOverflow bodyScrollW='+d.body.scrollWidth+' clientW='+d.documentElement.clientWidth+'\n';
};
</script></body></html>
