<!DOCTYPE html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" src="index.html" style="width:1280px;height:1800px;border:0"></iframe>
<pre id="dump" style="font:11px monospace;white-space:pre-wrap"></pre>
<script>
function d(){ return document.getElementById('f').contentDocument; }
function W(){ return document.getElementById('f').contentWindow; }
function fire(n,t,c){ n.dispatchEvent(new (W())[c](t,{bubbles:true})); }
setTimeout(function(){
  var i=d().getElementById('dest'); i.value='Charleston'; fire(i,'input','Event');
  setTimeout(function(){
    var ac = d().getElementById('destAc').innerText;
    var it=d().querySelector('#destAc .ac-item'); if(it) fire(it,'click','MouseEvent');
    setTimeout(function(){
      d().getElementById('to2').click();
      setTimeout(function(){
        var days=d().querySelectorAll('.cal-d:not(:disabled)'); days[5].click();
        setTimeout(function(){ var d2=d().querySelectorAll('.cal-d:not(:disabled)'); d2[8].click();
          setTimeout(function(){
            d().getElementById('to3').click();
            setTimeout(function(){
              // open the first party's airport picker
              var pick = d().querySelector('#parties button');
              var btns=[].slice.call(d().querySelectorAll('#parties button')).filter(function(b){return /pick airport/.test(b.textContent);});
              if(btns[0]) btns[0].click();
              setTimeout(function(){
                var inp = d().querySelector('#sheet input');
                var res1='';
                if(inp){ inp.value='Toronto'; fire(inp,'input','Event'); }
                setTimeout(function(){
                  res1 = d().getElementById('sheet').innerText;
                  if(inp){ inp.value='Phoenix'; fire(inp,'input','Event'); }
                  setTimeout(function(){
                    document.getElementById('dump').textContent =
                      'DEST AC for "Charleston":\n'+ac+'\n\n=== SHEET (Toronto):\n'+res1+
                      '\n\n=== SHEET (Phoenix):\n'+d().getElementById('sheet').innerText;
                  }, 500);
                }, 600);
              }, 500);
            }, 400);
          }, 400);
        }, 400);
      }, 400);
    }, 400);
  }, 600);
}, 1500);
</script>
