<!doctype html><html><body style="margin:0">
<iframe id="f" src="/index.html" style="width:390px;height:600px;border:0"></iframe>
<pre id="log" style="font:10px monospace;white-space:pre-wrap"></pre>
<script>
const w=ms=>new Promise(r=>setTimeout(r,ms));
f.onload=async()=>{
  const d=f.contentDocument, W=f.contentWindow;
  await w(500);
  const dest=d.getElementById('dest'); dest.focus();
  for(const ch of 'nash'){ dest.value+=ch; dest.dispatchEvent(new W.Event('input',{bubbles:true})); await w(40); }
  await w(250); d.querySelectorAll('#destAc .ac-item')[1].click(); await w(200);
  d.getElementById('to2').click(); await w(700);
  log.textContent = d.getElementById('cal').innerHTML.slice(0,1400);
};
</script></body></html>
