<!doctype html><html><body style="margin:0">
<iframe id="f" src="/index.html" style="width:390px;height:900px;border:0"></iframe>
<pre id="log" style="font:11px monospace"></pre>
<script>
const w=ms=>new Promise(r=>setTimeout(r,ms));
const type=async(W,inp,s)=>{inp.focus();inp.value='';for(const c of s){inp.value+=c;inp.dispatchEvent(new W.Event('input',{bubbles:true}));await w(30);}};
f.onload=async()=>{
  const d=f.contentDocument, W=f.contentWindow;
  await w(400);
  await type(W,d.getElementById('dest'),'nash'); await w(220);
  d.querySelectorAll('#destAc .ac-item')[1].click(); await w(150);
  d.getElementById('to2').click(); await w(500);
  d.querySelector('#cal [data-cal="1"]').click(); await w(250);
  [...d.querySelectorAll('#cal [data-day]')].find(b=>b.getAttribute('data-day')==='2026-11-13').click(); await w(250);
  d.getElementById('to3').click(); await w(400);
  const c=d.querySelectorAll('#parties .party')[0];
  await type(W,c.querySelector('[data-f="name"]'),'Jess + Mara'); await w(200);
  log.textContent += 'name field right after typing: '+JSON.stringify(d.querySelectorAll('#parties .party')[0].querySelector('[data-f="name"]').value)+'\n';
  c.querySelector('[data-addair]').click(); await w(300);
  await type(W,c.querySelector('[data-airinput]'),'jfk'); await w(400);
  c.querySelector('[data-airac] .ac-item').click(); await w(500);
  log.textContent += 'name field after picking airport: '+JSON.stringify(d.querySelectorAll('#parties .party')[0].querySelector('[data-f="name"]').value)+'\n';
};
</script></body></html>
