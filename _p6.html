<!DOCTYPE html><meta charset="utf-8">
<body style="margin:0">
<iframe id="f" src="index.html" style="width:1280px;height:3000px;border:0"></iframe>
<script>
function d(){ return document.getElementById('f').contentDocument; }
function W(){ return document.getElementById('f').contentWindow; }
function fire(n,t,c){ n.dispatchEvent(new (W())[c](t,{bubbles:true})); }
setTimeout(function(){
  var i=d().getElementById('dest'); i.value='CHS'; fire(i,'input','Event');
  var it=d().querySelector('#destAc .ac-item'); if(it) fire(it,'click','MouseEvent');
  setTimeout(function(){
    d().getElementById('to2').click();
    setTimeout(function(){
      var days=d().querySelectorAll('.cal-d:not(:disabled)');
      if(days.length>10) days[5].click();
      setTimeout(function(){
        var d2=d().querySelectorAll('.cal-d:not(:disabled)');
        if(d2.length>12) d2[8].click();
        setTimeout(function(){
          d().getElementById('to3').click();
          setTimeout(function(){
            d().getElementById('addParty').click();
            d().getElementById('addParty').click();
            d().getElementById('addParty').click();
          }, 400);
        }, 400);
      }, 400);
    }, 400);
  }, 500);
}, 1500);
</script>
